name: Dispatch Release Artifacts

on:
  push:
    tags:
      - "v*"

concurrency:
  group: dispatch-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      DISPATCH_OFFLINE_FIXTURE: "true"
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Setup pinned interoperability Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
          package-manager-cache: false

      - name: Install pinned Go proof toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.3'
          cache: false

      - name: Install pinned Python participant dependencies
        run: bash interop/python-participant/bootstrap.sh

      - name: Install pinned TypeScript participant dependencies
        run: npm --prefix interop/typescript-participant ci --ignore-scripts --no-audit --no-fund

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: 44af277848173664f72ca85f2a1b3b98d634ecdd
          path: .release/kujo
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/ai-sdk
          ref: 5184a122590dd5698770b50d99b69ed11c7ec84a
          path: .release/ai-sdk
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/workcell
          ref: 4ec4227f8190e05a329c2ee2975d77fce7872313
          path: .release/workcell
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/ability
          ref: 2dc7d4e9eb25e987544ac48793cd11d1999c45e0
          path: .release/ability
      - name: Check offline adapter tools
        run: |
          command -v node
          command -v sqlite3
      - name: Install reviewed Kujo release
        uses: kujolang/kujo/.github/actions/setup-kujo@fc53093f35e4236682bbbf5ab1ccc8d2b4df990c
        with:
          version: v1.6.0
      - run: echo "KUJO_BIN=$(command -v kujo)" >> "$GITHUB_ENV"
      - name: Checkout controlled Agents SDK participant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kujolang/agents-sdk
          ref: 5a9d5525e511a293b743b1c44d9ef270fd491f9f
          path: .release/agents-sdk-wave-d
      - name: Checkout controlled MCP participant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kujolang/mcp
          ref: 427a8b9ecfaee97cd66c6b35137bd1dc5fb16b54
          path: .release/mcp-wave-d
      - name: Install controlled participant dependencies
        run: |
          git clone --filter=blob:none https://github.com/kujolang/kennel.git .release/kennel-wave-d
          git -C .release/kennel-wave-d checkout --detach 093d44dddcebebd99bd8987e3efcb7e044dc45a7
          "$KUJO_BIN" run .release/kennel-wave-d/kennel.kujo --interpreter -- install --project-dir "$GITHUB_WORKSPACE/.release/agents-sdk-wave-d"
      - name: Checkout retained-host Workcell graph fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kujolang/workcell
          ref: 0f9595b79872d2500f0bb35a8cf6227171fd7eeb
          path: .release/workcell-wave-f
      - name: Checkout exact Eval graph contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kujolang/eval
          ref: 6a5ab09e5c24cc1a842b374afccb64da40db2874
          path: .release/eval-wave-f
      - name: Prepare bounded graph fixture module layout
        run: |
          bash tests/ci_graph_layout_tests.sh
          DISPATCH_GRAPH_FIXTURE_ROOT="$GITHUB_WORKSPACE/.release" bash scripts/prepare_graph_fixture_layout.sh
      - name: Verify exact tagged source
        env:
          AI_SDK_PATH: ${{ github.workspace }}/.release/ai-sdk
          WORKCELL_ROOT: ${{ github.workspace }}/.release/workcell
          ABILITY_ROOT: ${{ github.workspace }}/.release/ability
          AGENTS_SDK_ROOT: ${{ github.workspace }}/.release/agents-sdk-wave-d
          MCP_ROOT: ${{ github.workspace }}/.release/mcp-wave-d
        run: bash scripts/run_release_gate.sh

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify tag and package version
        run: |
          version="$(grep -E '^version' kennel.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build source artifact and checksum
        run: |
          artifact="dispatch-${GITHUB_REF_NAME}.tar.gz"
          tar --exclude=.git --exclude=outputs --exclude=tests/tmp -czf "$RUNNER_TEMP/$artifact" .
          mv "$RUNNER_TEMP/$artifact" "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          commit_sha="$(git rev-parse HEAD)"
          artifact_sha="$(awk '{print $1}' "$artifact.sha256")"
          printf '{"schema_version":"1.0","tag":"%s","dispatch_commit":"%s","artifact":"%s","artifact_sha256":"%s","dependency_manifest":"release/dispatch-v1.3.0.refs"}\n' \
            "$GITHUB_REF_NAME" "$commit_sha" "$artifact" "$artifact_sha" \
            > "dispatch-${GITHUB_REF_NAME}-provenance.json"
      - name: Attest source artifact provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: "dispatch-${{ github.ref_name }}.tar.gz"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "Dispatch $GITHUB_REF_NAME" --notes-file docs/RELEASE_1_3_0.md
          gh release upload "$GITHUB_REF_NAME" "dispatch-${GITHUB_REF_NAME}.tar.gz" "dispatch-${GITHUB_REF_NAME}.tar.gz.sha256" "dispatch-${GITHUB_REF_NAME}-provenance.json" --clobber

  clean-install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Install pinned Dispatch closure
        run: |
          curl -fsSL "https://raw.githubusercontent.com/kujolang/kujo/fc53093f35e4236682bbbf5ab1ccc8d2b4df990c/install.sh" \
            | bash -s -- --package dispatch \
                --release-manifest "https://raw.githubusercontent.com/kujolang/dispatch/${GITHUB_REF_NAME}/release/dispatch-v1.3.0.refs"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify installed workload outside source tree
        env:
          DISPATCH_OFFLINE_FIXTURE: "true"
        run: |
          cd "$(mktemp -d)"
          dispatch version
          dispatch validate --workflow-file "$HOME/.kujo/sources/dispatch/examples/workflows/routed-review.json" --json
          dispatch demo "Tagged release smoke" \
            --workflow-file "$HOME/.kujo/sources/dispatch/examples/workflows/routed-review.json" \
            --yes --non-interactive --output-root dispatch-smoke
