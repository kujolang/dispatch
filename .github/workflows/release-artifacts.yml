name: Dispatch Release Artifacts

on:
  push:
    tags:
      - "v*"

concurrency:
  group: dispatch-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DISPATCH_OFFLINE_FIXTURE: "true"
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: 5d72aab4b99e7f8c01e4c208d6c97061934c7447
          path: .release/kujo
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/ai-sdk
          ref: 849dbbbba7a734938320dd9569d1ed7aa6240298
          path: .release/ai-sdk
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/workcell
          ref: b34c26c90a8626c988a4234fd2610dcf11df1634
          path: .release/workcell
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/ability
          ref: f103ac5904c69ad7a1c6dffb262200f986d734d4
          path: .release/ability
      - name: Check offline adapter tools
        run: |
          command -v node
          command -v sqlite3
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: cargo build --release --locked --manifest-path .release/kujo/Cargo.toml
      - name: Verify exact tagged source
        env:
          KUJO_BIN: ${{ github.workspace }}/.release/kujo/target/release/kujo
          AI_SDK_PATH: ${{ github.workspace }}/.release/ai-sdk
          WORKCELL_ROOT: ${{ github.workspace }}/.release/workcell
          ABILITY_ROOT: ${{ github.workspace }}/.release/ability
        run: bash scripts/run_release_gate.sh

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify tag and package version
        run: |
          version="$(grep -E '^version' kennel.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build source artifact and checksum
        run: |
          artifact="dispatch-${GITHUB_REF_NAME}.tar.gz"
          tar --exclude=.git --exclude=outputs --exclude=tests/tmp -czf "$RUNNER_TEMP/$artifact" .
          mv "$RUNNER_TEMP/$artifact" "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          commit_sha="$(git rev-parse HEAD)"
          artifact_sha="$(awk '{print $1}' "$artifact.sha256")"
          printf '{"schema_version":"1.0","tag":"%s","dispatch_commit":"%s","artifact":"%s","artifact_sha256":"%s","dependency_manifest":"release/dispatch-v1.3.0.refs"}\n' \
            "$GITHUB_REF_NAME" "$commit_sha" "$artifact" "$artifact_sha" \
            > "dispatch-${GITHUB_REF_NAME}-provenance.json"
      - name: Attest source artifact provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: "dispatch-${{ github.ref_name }}.tar.gz"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "Dispatch $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "dispatch-${GITHUB_REF_NAME}.tar.gz" "dispatch-${GITHUB_REF_NAME}.tar.gz.sha256" "dispatch-${GITHUB_REF_NAME}-provenance.json" --clobber

  clean-install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Install pinned Dispatch closure
        run: |
          curl -fsSL "https://raw.githubusercontent.com/kujolang/kujo/266a8902068a14c3d17f803bef467dc28f1fe162/install.sh" \
            | bash -s -- --package dispatch \
                --release-manifest "https://raw.githubusercontent.com/kujolang/dispatch/${GITHUB_REF_NAME}/release/dispatch-v1.3.0.refs"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify installed workload outside source tree
        env:
          DISPATCH_OFFLINE_FIXTURE: "true"
        run: |
          cd "$(mktemp -d)"
          dispatch version
          dispatch validate --workflow-file "$HOME/.kujo/sources/dispatch/examples/workflows/routed-review.json" --json
          dispatch demo "Tagged release smoke" \
            --workflow-file "$HOME/.kujo/sources/dispatch/examples/workflows/routed-review.json" \
            --yes --non-interactive --output-root dispatch-smoke
