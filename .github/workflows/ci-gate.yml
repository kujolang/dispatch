name: CI Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dispatch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-gate:
    name: Dispatch CI Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      DISPATCH_OFFLINE_FIXTURE: "true"
      # Bump deliberately after compatibility verification and record the
      # Dispatch-to-Kujo pairing in the release evidence.
      KUJO_RUNTIME_REF: "44af277848173664f72ca85f2a1b3b98d634ecdd"
      KUJO_V1_2_RUNTIME_REF: "123542ba17a0ef0150970a6c626b518946ff0bbb"
      RUSTUP_TOOLCHAIN: "1.96.0"

    steps:
      - name: Checkout dispatch repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0 # Exercise the actual pinned pre-negotiation controller.

      - name: Setup pinned interoperability Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
          package-manager-cache: false

      - name: Install pinned Go proof toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.3'
          cache: false

      - name: Install pinned Python participant dependencies
        run: bash interop/python-participant/bootstrap.sh

      - name: Install pinned TypeScript participant dependencies
        run: npm --prefix interop/typescript-participant ci --ignore-scripts --no-audit --no-fund

      - name: Checkout Kujo runtime repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_RUNTIME_REF }}
          path: .ci/kujo
          fetch-depth: 1

      - name: Checkout reviewed Workcell effect adapter
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/workcell
          ref: 4ec4227f8190e05a329c2ee2975d77fce7872313
          path: .ci/workcell
          fetch-depth: 1

      - name: Configure offline effect assurance adapters
        run: |
          command -v node
          command -v sqlite3
          echo "WORKCELL_ROOT=$GITHUB_WORKSPACE/.ci/workcell" >> "$GITHUB_ENV"

      - name: Checkout original Dispatch 1.2 Kujo runtime
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_V1_2_RUNTIME_REF }}
          path: .ci/kujo-old
          fetch-depth: 1

      - name: Checkout AI SDK repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/ai-sdk
          ref: 5184a122590dd5698770b50d99b69ed11c7ec84a
          path: .ci/ai-sdk
          fetch-depth: 1

      - name: Checkout Agents SDK repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/agents-sdk
          ref: 5a9d5525e511a293b743b1c44d9ef270fd491f9f
          path: .ci/agents-sdk
          fetch-depth: 1

      - name: Verify package version consistency
        run: |
          kennel_version="$(grep -E '^version' kennel.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          kujo_version="$(grep -E '^version' kujo.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          echo "kennel.toml=$kennel_version kujo.toml=$kujo_version"
          if [ "$kennel_version" != "$kujo_version" ]; then
            echo "Version mismatch between kennel.toml and kujo.toml" >&2
            exit 1
          fi

      - name: Checkout reviewed post-publication installer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: fc53093f35e4236682bbbf5ab1ccc8d2b4df990c
          path: .ci/installer

      - name: Verify immutable dependency closure and installer parser
        run: |
          grep -qx "kujo=44af277848173664f72ca85f2a1b3b98d634ecdd" release/dispatch-v1.3.0.refs
          grep -qx "ai-sdk=5184a122590dd5698770b50d99b69ed11c7ec84a" release/dispatch-v1.3.0.refs
          grep -qx "agents-sdk=5a9d5525e511a293b743b1c44d9ef270fd491f9f" release/dispatch-v1.3.0.refs
          grep -qx "dispatch=v1.3.0" release/dispatch-v1.3.0.refs
          grep -qx "kujo=$KUJO_RUNTIME_REF" release/dispatch-v1.3.0-validation.refs
          test "$(git -C .ci/kujo rev-parse HEAD)" = "$KUJO_RUNTIME_REF"
          test "$(git -C .ci/kujo-old rev-parse HEAD)" = "123542ba17a0ef0150970a6c626b518946ff0bbb"
          test "$(git -C .ci/ai-sdk rev-parse HEAD)" = "5184a122590dd5698770b50d99b69ed11c7ec84a"
          test "$(git -C .ci/agents-sdk rev-parse HEAD)" = "5a9d5525e511a293b743b1c44d9ef270fd491f9f"
          test -f .ci/ai-sdk/scripts/generate_model_catalog.kujo
          bash .ci/installer/tests/install_release_manifest.sh

      - name: Install reviewed Kujo release
        uses: kujolang/kujo/.github/actions/setup-kujo@fc53093f35e4236682bbbf5ab1ccc8d2b4df990c
        with:
          version: v1.6.0
      - name: Export runtime and SDK paths
        run: |
          echo "KUJO_BIN=$(command -v kujo)" >> "$GITHUB_ENV"
          echo "AI_SDK_PATH=$GITHUB_WORKSPACE/.ci/ai-sdk" >> "$GITHUB_ENV"

      - name: Verify runtime supports Kujo script execution
        run: |
          "$KUJO_BIN" --help | grep -q "run"

      - name: Verify default run path is warning-free
        run: bash scripts/check_vm_smoke.sh

      - name: Checkout reviewed Ability assurance gateway
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kujolang/ability
          ref: 2dc7d4e9eb25e987544ac48793cd11d1999c45e0
          path: .ci/ability

      - name: Configure application assurance fixture
        run: echo "ABILITY_ROOT=$GITHUB_WORKSPACE/.ci/ability" >> "$GITHUB_ENV"

      - name: Checkout controlled Agents SDK participant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kujolang/agents-sdk
          ref: 5a9d5525e511a293b743b1c44d9ef270fd491f9f
          path: .ci/agents-sdk-wave-d

      - name: Install controlled participant dependencies
        run: |
          git clone --filter=blob:none https://github.com/kujolang/kennel.git .ci/kennel-wave-d
          git -C .ci/kennel-wave-d checkout --detach 093d44dddcebebd99bd8987e3efcb7e044dc45a7
          "$KUJO_BIN" run .ci/kennel-wave-d/kennel.kujo --interpreter -- install --project-dir "$GITHUB_WORKSPACE/.ci/agents-sdk-wave-d"
          echo "AGENTS_SDK_ROOT=$GITHUB_WORKSPACE/.ci/agents-sdk-wave-d" >> "$GITHUB_ENV"

      - name: Checkout controlled MCP participant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kujolang/mcp
          ref: 427a8b9ecfaee97cd66c6b35137bd1dc5fb16b54
          path: .ci/mcp-wave-d

      - name: Configure controlled MCP fixture
        run: echo "MCP_ROOT=$GITHUB_WORKSPACE/.ci/mcp-wave-d" >> "$GITHUB_ENV"

      - name: Run Dispatch release gate
        timeout-minutes: 45
        run: bash scripts/run_release_gate.sh

      - name: Run pinned AI SDK release gate
        timeout-minutes: 15
        working-directory: .ci/ai-sdk
        run: bash scripts/release_quality_gates.sh

      - name: Run pinned Agents SDK offline gate
        timeout-minutes: 15
        working-directory: .ci/agents-sdk
        run: bash scripts/ci_no_network_enforcement.sh

      - name: Setup historical Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Build the pinned Dispatch 1.2 Kujo runtime
        timeout-minutes: 50
        run: cargo build --release --locked --manifest-path .ci/kujo-old/Cargo.toml

      - name: Rehearse quiesced v1.2 upgrade and backup rollback
        timeout-minutes: 20
        run: |
          git fetch --depth=1 origin refs/tags/v1.2.0:refs/tags/v1.2.0
          grep -qx 'kujo=123542ba17a0ef0150970a6c626b518946ff0bbb' \
            <(git show v1.2.0:release/dispatch-v1.2.0.refs)
          export KUJO_OLD_BIN="${GITHUB_WORKSPACE}/.ci/kujo-old/target/release/kujo"
          test "$("$KUJO_OLD_BIN" --version)" = 'kujo 1.0.2'
          bash tests/upgrade_rehearsal_tests.sh

      - name: Measure catalog state and trace scale
        timeout-minutes: 10
        run: bash tests/benchmarks/measure_state_scale.sh

      - name: Clean-install pinned candidate and verify shim outside source
        timeout-minutes: 35
        run: |
          candidate_dir="$RUNNER_TEMP/dispatch-candidate"
          candidate_manifest="$RUNNER_TEMP/dispatch-candidate.refs"
          sed "s/^dispatch=v1.3.0$/dispatch=${GITHUB_SHA}/" release/dispatch-v1.3.0.refs > "$candidate_manifest"
          grep -qx "dispatch=$(git rev-parse HEAD)" "$candidate_manifest"
          bash .ci/installer/install.sh --package dispatch --source \
            --release-manifest "$candidate_manifest" \
            --prefix "$candidate_dir/root" --bin-dir "$candidate_dir/bin"
          bash tests/installed_package_tests.sh "$candidate_dir/root"
