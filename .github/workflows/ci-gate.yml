name: CI Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dispatch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-gate:
    name: Dispatch CI Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      DISPATCH_OFFLINE_FIXTURE: "true"
      # Bump deliberately after compatibility verification and record the
      # Dispatch-to-Kujo pairing in the release evidence.
      KUJO_RUNTIME_REF: "87fae36dd331b185d29256f74d2a92f1aefc5ea5"
      KUJO_V1_2_RUNTIME_REF: "123542ba17a0ef0150970a6c626b518946ff0bbb"
      RUSTUP_TOOLCHAIN: "1.96.0"

    steps:
      - name: Checkout dispatch repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout Kujo runtime repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_RUNTIME_REF }}
          path: .ci/kujo
          fetch-depth: 1

      - name: Checkout original Dispatch 1.2 Kujo runtime
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_V1_2_RUNTIME_REF }}
          path: .ci/kujo-old
          fetch-depth: 1

      - name: Checkout AI SDK repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/ai-sdk
          ref: 849dbbbba7a734938320dd9569d1ed7aa6240298
          path: .ci/ai-sdk
          fetch-depth: 1

      - name: Checkout Agents SDK repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/agents-sdk
          ref: d3904d348754b492bda298b6c30f49c1eb24b7ea
          path: .ci/agents-sdk
          fetch-depth: 1

      - name: Verify package version consistency
        run: |
          kennel_version="$(grep -E '^version' kennel.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          kujo_version="$(grep -E '^version' kujo.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          echo "kennel.toml=$kennel_version kujo.toml=$kujo_version"
          if [ "$kennel_version" != "$kujo_version" ]; then
            echo "Version mismatch between kennel.toml and kujo.toml" >&2
            exit 1
          fi

      - name: Verify immutable dependency closure and installer parser
        run: |
          grep -qx "kujo=87fae36dd331b185d29256f74d2a92f1aefc5ea5" release/dispatch-v1.3.0.refs
          grep -qx "ai-sdk=849dbbbba7a734938320dd9569d1ed7aa6240298" release/dispatch-v1.3.0.refs
          grep -qx "agents-sdk=d3904d348754b492bda298b6c30f49c1eb24b7ea" release/dispatch-v1.3.0.refs
          grep -qx "dispatch=v1.3.0" release/dispatch-v1.3.0.refs
          test "$(git -C .ci/kujo rev-parse HEAD)" = "87fae36dd331b185d29256f74d2a92f1aefc5ea5"
          test "$(git -C .ci/kujo-old rev-parse HEAD)" = "123542ba17a0ef0150970a6c626b518946ff0bbb"
          test "$(git -C .ci/ai-sdk rev-parse HEAD)" = "849dbbbba7a734938320dd9569d1ed7aa6240298"
          test "$(git -C .ci/agents-sdk rev-parse HEAD)" = "d3904d348754b492bda298b6c30f49c1eb24b7ea"
          test -f .ci/ai-sdk/scripts/generate_model_catalog.kujo
          bash .ci/kujo/tests/install_release_manifest.sh

      - name: Setup Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: .ci/kujo

      - name: Build Kujo runtime
        run: cargo build --release --locked --manifest-path .ci/kujo/Cargo.toml

      - name: Export Kujo runtime path
        run: |
          echo "KUJO_BIN=${GITHUB_WORKSPACE}/.ci/kujo/target/release/kujo" >> "$GITHUB_ENV"
          echo "AI_SDK_PATH=${GITHUB_WORKSPACE}/.ci/ai-sdk" >> "$GITHUB_ENV"

      - name: Verify runtime supports Kujo script execution
        run: |
          "$KUJO_BIN" --help | grep -q "run"

      - name: Verify default run path is warning-free
        run: bash scripts/check_vm_smoke.sh

      - name: Run Dispatch release gate
        timeout-minutes: 45
        run: bash scripts/run_release_gate.sh

      - name: Run pinned AI SDK release gate
        timeout-minutes: 15
        working-directory: .ci/ai-sdk
        run: bash scripts/release_quality_gates.sh

      - name: Run pinned Agents SDK offline gate
        timeout-minutes: 15
        working-directory: .ci/agents-sdk
        run: bash scripts/ci_no_network_enforcement.sh

      - name: Build the pinned Dispatch 1.2 Kujo runtime
        timeout-minutes: 50
        run: cargo build --release --locked --manifest-path .ci/kujo-old/Cargo.toml

      - name: Rehearse quiesced v1.2 upgrade and backup rollback
        timeout-minutes: 20
        run: |
          git fetch --depth=1 origin refs/tags/v1.2.0:refs/tags/v1.2.0
          grep -qx 'kujo=123542ba17a0ef0150970a6c626b518946ff0bbb' \
            <(git show v1.2.0:release/dispatch-v1.2.0.refs)
          export KUJO_OLD_BIN="${GITHUB_WORKSPACE}/.ci/kujo-old/target/release/kujo"
          test "$("$KUJO_OLD_BIN" --version)" = 'kujo 1.0.2'
          bash tests/upgrade_rehearsal_tests.sh

      - name: Measure catalog state and trace scale
        timeout-minutes: 10
        run: bash tests/benchmarks/measure_state_scale.sh

      - name: Clean-install pinned candidate and verify shim outside source
        timeout-minutes: 35
        run: |
          candidate_dir="$RUNNER_TEMP/dispatch-candidate"
          candidate_manifest="$RUNNER_TEMP/dispatch-candidate.refs"
          sed "s/^dispatch=v1.3.0$/dispatch=${GITHUB_SHA}/" release/dispatch-v1.3.0.refs > "$candidate_manifest"
          grep -qx "dispatch=$(git rev-parse HEAD)" "$candidate_manifest"
          bash .ci/kujo/install.sh --package dispatch --source \
            --release-manifest "$candidate_manifest" \
            --prefix "$candidate_dir/root" --bin-dir "$candidate_dir/bin"
          bash tests/installed_package_tests.sh "$candidate_dir/root"
