name: compatibility-matrix

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday
  workflow_dispatch:

jobs:
  matrix-test:
    strategy:
      matrix:
        kujo-ref:
          - "7819d1475e909ec88f510c9927445791ea928836"  # Current pinned
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Kujo runtime (${{ matrix.kujo-ref }})
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/kujo-runtime
          git -C /tmp/kujo-runtime remote add origin https://github.com/kujolang/dispatch.git
          git -C /tmp/kujo-runtime fetch --depth 1 origin "${{ matrix.kujo-ref }}"
          git -C /tmp/kujo-runtime checkout --detach "${{ matrix.kujo-ref }}"
          cargo build --release --locked --manifest-path /tmp/kujo-runtime/Cargo.toml
          echo "/tmp/kujo-runtime/target/release" >> "$GITHUB_PATH"

      - name: Verify Kujo runtime
        run: kujo --version

      - name: Run contract tests
        run: kujo test

      - name: Run eval CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          kujo run main.ruff version
          kujo run main.ruff list-checks
          kujo run main.ruff run examples/basic_suite.json --json
