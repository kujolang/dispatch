[package]
name = "dispatch"
version = "0.1.0"
description = "Reliable workflow orchestration for multi-step AI agent systems in Kujo."
license = "MIT"
authors = ["Robert DeVore <me@robertdevore.com>"]
homepage = ""
repository = "https://github.com/kujolang/dispatch"
documentation = ""
keywords = ["kujo", "agents", "workflow", "orchestration"]
categories = ["ai", "developer-tools"]
readme = "README.md"

[package.status]
stage = "experimental"
stability = "early"
public_api = false
notes = "Workflow contracts are stabilizing and may change before 1.0."

[kujo]
minimum_version = "0.1.0"
entry = "dispatch.kujo"
sources = ["."]
includes = ["README.md", "examples", "tests"]
excludes = [".git", "kennel_packages", "dist", "build", "node_modules", "outputs"]

[build]
command = ""
output = "dist"
artifacts = []

[dependencies]
ai-sdk = { source = "github:kujolang/ai-sdk", ref = "main" }

[dev-dependencies]

[scripts]
demo = "kujo run --interpreter dispatch.kujo demo \"Research topic\" --yes"
test = "kujo test-run tests/dispatch_tests.kujo"

[package.exports]
engine = "runner.kujo"
cli = "dispatch.kujo"

[package.metadata]
bridge_script = "bridge_chat.kujo"

[registry]
index = ""
publish = ""

[trust]
checksum = ""
signature = ""
signing_key = ""
