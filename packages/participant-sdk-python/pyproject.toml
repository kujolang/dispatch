[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kujo-participant-sdk"
version = "0.1.0a1"
description = "Experimental alpha participant correlation SDK; unpublished"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["jsonschema==4.23.0"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
kujo_participant_sdk = ["assets/*", "*.pyi", "py.typed"]
