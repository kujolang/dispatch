objective: "Use Kujo-native write_file_atomic for Dispatch state/report writes and preserve existing directory, redaction, and recovery behavior."
checklist_file: ""
max_iterations: 8
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: kujo_checks
    command: "for f in dispatch.kujo src/core/*.kujo src/tools/*.kujo src/workflows/*.kujo tests/*.kujo; do /Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo check \"$f\" >/dev/null || exit 1; done"
  - id: regression_tests
    command: "KUJO_BIN=/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo /Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo test-run tests/sdk_adapter_tests.kujo -v && KUJO_BIN=/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo /Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo test-run tests/policy_precedence_tests.kujo -v && KUJO_BIN=/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo /Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo test-run tests/dispatch_tests.kujo -v"
  - id: diff_check
    command: "git diff --check"
  - id: diff_check
    command: "git diff --check"
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
